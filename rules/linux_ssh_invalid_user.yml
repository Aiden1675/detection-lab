title: SSH Login Attempt for Non-Existent User
id: d4a1b8c3-6e27-4c95-b3f0-8a2d5e7c1f94
status: experimental
description: Detects an SSH login attempt with a username that does not exist on the host, a common sign of password guessing or user enumeration.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Aiden1675
date: 2026/10/01
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: linux
  service: auth
detection:
  keywords:
    - 'sshd*Invalid user*from'
  condition: keywords
falsepositives:
  - Users mistyping their username
  - Internet-wide scanners if SSH is exposed
level: low

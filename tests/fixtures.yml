# Scenario names map to tests/captured/<name>.log, produced by
# tools/run_scenarios.sh on the lab VM. A rule must fire on at least one
# line of each of its attack scenarios and on no line of any benign one.
rules:
  5b1f0c2e-8a47-4d3b-9e61-2c7a4f1d9b03:
    attack: [attack_useradd]
  a3c9d5e7-1f28-4b6a-8d40-7e2b9c6f1a58:
    attack: [attack_root_shell, attack_su_dash]
benign:
  - benign_useradd_system
  - benign_apt_simulate
  - benign_systemctl
  - benign_ls_root
